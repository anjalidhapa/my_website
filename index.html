
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Ecommerce</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

/* Navbar */
.navbar {
    background: #111827;
    color: white;
    padding: 18px 8%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: orange;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-links a {
    text-decoration: none;
    color: white;
}

.cart-btn {
    padding: 10px 18px;
    border: none;
    background: orange;
    border-radius: 6px;
    cursor: pointer;
}

/* Hero */
.hero {
    background: linear-gradient(120deg, #1e293b, #475569);
    height: 320px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    margin-bottom: 20px;
    font-size: 18px;
}

.shop-btn {
    background: orange;
    color: black;
    text-decoration: none;
    padding: 12px 25px;
    display: inline-block;
    border-radius: 6px;
}

/* Product Section */
.products {
    padding: 50px 8%;
}

.products h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 32px;
}

.product-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.product-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 12px #00000010;
    transition: 0.3s;
}

.product-card:hover {
    transform: translateY(-6px);
}

.product-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-bottom: 10px;
}

.product-info p {
    color: #777;
    margin-bottom: 12px;
}

.price {
    color: #16a34a;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.add-btn {
    width: 100%;
    padding: 12px;
    background: #111827;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.add-btn:hover {
    background: orange;
    color: black;
}

/* Cart Sidebar */
.cart-panel {
    position: fixed;
    top: 0;
    right: -400px;
    width: 380px;
    height: 100vh;
    background: white;
    z-index: 1000;
    padding: 25px;
    box-shadow: -5px 0 20px #00000020;
    transition: 0.4s;
    display: flex;
    flex-direction: column;
}

.cart-panel.active {
    right: 0;
}

.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 15px;
    border-bottom: 1px solid #ddd;
}

.close-btn {
    font-size: 28px;
    background: none;
    border: none;
    cursor: pointer;
}

#cart-items {
    flex: 1;
    overflow-y: auto;
    padding-top: 15px;
}

.cart-item {
    border-bottom: 1px solid #eee;
    padding: 15px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.cart-item h4 {
    font-size: 14px;
}

.cart-item p {
    margin-top: 6px;
    color: green;
}

.quantity-controls {
    display: flex;
    align-items: center;
    gap: 7px;
}

.quantity-controls button {
    border: none;
    width: 25px;
    height: 25px;
    cursor: pointer;
    background: #e5e7eb;
    border-radius: 4px;
}

.remove-btn {
    background: none;
    border: none;
    color: red;
    cursor: pointer;
}

.cart-footer {
    border-top: 1px solid #ddd;
    padding-top: 20px;
}

.cart-footer h3 {
    margin-bottom: 15px;
}

.checkout-btn {
    width: 100%;
    padding: 14px;
    background: orange;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

/* Responsive */
@media (max-width: 1000px) {
    .product-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .navbar {
        padding: 15px 5%;
    }

    .nav-links {
        gap: 12px;
    }

    .nav-links a {
        display: none;
    }

    .hero h1 {
        font-size: 30px;
    }

    .product-container {
        grid-template-columns: 1fr;
    }

    .cart-panel {
        width: 100%;
        right: -100%;
    }

    .cart-panel.active {
        right: 0;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">ShopEase</div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#products">Products</a>

        <button class="cart-btn" onclick="toggleCart()">
            Cart (<span id="cart-count">0</span>)
        </button>
    </div>
</nav>

<!-- Hero Section -->
<section class="hero">
    <div>
        <h1>Discover Your Style</h1>
        <p>Find the best products at amazing prices.</p>
        <a href="#products" class="shop-btn">Shop Now</a>
    </div>
</section>

<!-- Products Section -->
<section class="products" id="products">
    <h2>Our Products</h2>
    <div class="product-container" id="product-container"></div>
</section>

<!-- Cart Sidebar -->
<div class="cart-panel" id="cart-panel">
    <div class="cart-header">
        <h2>My Cart</h2>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>

    <div id="cart-items"></div>

    <div class="cart-footer">
        <h3>Total: ₹<span id="cart-total">0</span></h3>
        <button class="checkout-btn" onclick="checkout()">Checkout</button>
    </div>
</div>

<script>
// Product Array
let products = [
    {
        id: 1,
        name: "Wireless Headphones",
        description: "Premium sound quality",
        price: 1999,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
    },
    {
        id: 2,
        name: "Smart Watch",
        description: "Modern smart watch",
        price: 2499,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"
    },
    {
        id: 3,
        name: "Sneakers",
        description: "Comfortable everyday shoes",
        price: 1799,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"
    },
    {
        id: 4,
        name: "Backpack",
        description: "Stylish travel backpack",
        price: 1299,
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600"
    },
    {
        id: 5,
        name: "Camera",
        description: "Capture every moment",
        price: 4999,
        image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600"
    },
    {
        id: 6,
        name: "Sunglasses",
        description: "Classic fashion sunglasses",
        price: 999,
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600"
    },
    {
        id: 7,
        name: "Keyboard",
        description: "Mechanical gaming keyboard",
        price: 1499,
        image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600"
    },
    {
        id: 8,
        name: "Perfume",
        description: "Fresh premium fragrance",
        price: 1599,
        image: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=600"
    }
];

// Cart Array
let cart = [];

// Display Products
function displayProducts() {
    let container = document.getElementById("product-container");

    products.forEach(function(product) {
        container.innerHTML += `
            <div class="product-card">
                <img src="${product.image}" alt="${product.name}">

                <div class="product-info">
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <div class="price">₹${product.price}</div>

                    <button class="add-btn" onclick="addToCart(${product.id})">
                        Add to Cart
                    </button>
                </div>
            </div>
        `;
    });
}

// Add to Cart
function addToCart(id) {
    let product = products.find(function(item) {
        return item.id === id;
    });

    let existingItem = cart.find(function(item) {
        return item.id === id;
    });

    if (existingItem) {
        existingItem.quantity++;
    } else {
        cart.push({
            ...product,
            quantity: 1
        });
    }

    displayCart();
}

// Display Cart
function displayCart() {
    let cartItems = document.getElementById("cart-items");
    let cartCount = document.getElementById("cart-count");
    let cartTotal = document.getElementById("cart-total");

    cartItems.innerHTML = "";

    let totalQuantity = 0;
    let totalPrice = 0;

    cart.forEach(function(item) {
        totalQuantity += item.quantity;
        totalPrice += item.price * item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">
                <div>
                    <h4>${item.name}</h4>
                    <p>₹${item.price}</p>
                </div>

                <div class="quantity-controls">
                    <button onclick="changeQuantity(${item.id}, -1)">-</button>
                    <span>${item.quantity}</span>
                    <button onclick="changeQuantity(${item.id}, 1)">+</button>
                </div>

                <button class="remove-btn" onclick="removeItem(${item.id})">
                    Remove
                </button>
            </div>
        `;
    });

    cartCount.innerText = totalQuantity;
    cartTotal.innerText = totalPrice;
}

// Change Quantity
function changeQuantity(id, change) {
    let item = cart.find(function(product) {
        return product.id === id;
    });

    item.quantity += change;

    if (item.quantity <= 0) {
        removeItem(id);
    } else {
        displayCart();
    }
}

// Remove Item
function removeItem(id) {
    cart = cart.filter(function(item) {
        return item.id !== id;
    });

    displayCart();
}

// Toggle Cart
function toggleCart() {
    document.getElementById("cart-panel").classList.toggle("active");
}

// Checkout
function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
    } else {
        alert("Thank you for shopping with ShopEase!");
    }
}

// Initial Load
displayProducts();
displayCart();
</script>

</body>
</html>
